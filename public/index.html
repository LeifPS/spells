<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#120a35">
<title>Spells – Zeichne deine Zauber</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Hauptmenü -->
<section id="menu" class="screen active">
  <h1 class="logo">✦ SPELLS ✦</h1>
  <p class="sub">Zeichne deine Zauber. Besiege deinen Gegner.</p>
  <div class="coins"><span id="coins">0</span> 🪙</div>
  <input id="nameInput" maxlength="14" placeholder="Dein Zaubername" autocomplete="off">
  <button id="btnFight" class="btn big primary">⚔️ Kämpfen</button>
  <button id="btnBook" class="btn big">📖 Zauberbuch</button>
  <button id="btnPacks" class="btn big">🎁 Zauberpakete</button>
  <div class="stats" id="stats"></div>
  <button id="btnMute" class="mute" aria-label="Ton an/aus">🔊</button>
</section>

<!-- Zauberbuch -->
<section id="book" class="screen">
  <header class="bar"><button class="btn small back" data-go="menu">‹ Zurück</button><h2>Zauberbuch</h2><span id="bookCount"></span></header>
  <div id="bookGrid" class="grid"></div>
</section>

<!-- Üben -->
<section id="practice" class="screen">
  <header class="bar"><button class="btn small back" data-go="book">‹ Zurück</button><h2 id="pracTitle">Üben</h2><button id="pracHelp" class="btn small">Hilfe: an</button></header>
  <div class="pracInfo" id="pracInfo"></div>
  <canvas id="pracCv" class="padcv"></canvas>
  <div id="pracResult" class="pracResult"></div>
</section>

<!-- Pakete -->
<section id="packs" class="screen">
  <header class="bar"><button class="btn small back" data-go="menu">‹ Zurück</button><h2>Zauberpakete</h2><span class="coins small"><span id="coins2">0</span> 🪙</span></header>
  <div class="packWrap">
    <div id="packCard" class="packCard"><div class="packBack">🎁</div></div>
    <div id="packInfo" class="packInfo">Ein Paket enthält <b>einen</b> neuen Zauber.</div>
    <button id="btnOpen" class="btn big primary">Öffnen – 60 🪙</button>
    <div class="odds" id="odds"></div>
  </div>
</section>

<!-- Suche -->
<section id="queue" class="screen">
  <div class="spinner"></div>
  <h2 id="queueText">Suche Gegner …</h2>
  <p class="sub" id="queueSub">Wenn niemand gefunden wird, tritt ein Übungsgegner an.</p>
  <button id="btnCancel" class="btn">Abbrechen</button>
</section>

<!-- Kampf -->
<section id="match" class="screen">
  <div id="hud">
    <div class="side" id="hudOpp">
      <div class="nm"><span id="nmOpp"></span><span class="st" id="stOpp"></span></div>
      <div class="hp"><div class="hpFill" id="hpOpp"></div><div class="shFill" id="shOpp"></div><span class="hpTxt" id="hpTxtOpp">200</span></div>
    </div>
    <div class="mid"><div id="roundNo">Runde 1</div><div class="timer"><div id="timerFill"></div></div></div>
    <div class="side you" id="hudYou">
      <div class="nm"><span id="nmYou"></span><span class="st" id="stYou"></span></div>
      <div class="hp"><div class="hpFill" id="hpYou"></div><div class="shFill" id="shYou"></div><span class="hpTxt" id="hpTxtYou">200</span></div>
    </div>
  </div>
  <canvas id="arenaCv"></canvas>
  <div id="banner"></div>
  <div class="padWrap">
    <div id="chips"></div>
    <canvas id="padCv" class="padcv"></canvas>
    <button id="btnLock" class="btn primary lock" disabled>⚡ Zaubern</button>
  </div>
</section>

<!-- Ende -->
<div id="end" class="overlay">
  <div class="endBox">
    <h1 id="endTitle"></h1>
    <p id="endSub"></p>
    <div id="endCoins"></div>
    <button id="btnEndMenu" class="btn big primary">Zum Menü</button>
    <button id="btnEndAgain" class="btn big">Nochmal kämpfen</button>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
